<!-- @dsCard group="Colors" viewport="700x170" name="Semantic roles" subtitle="Which token to reach for, by job" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{font-family:var(--font-core);background:#fff;color:var(--text-body)}.wrap{padding:20px 24px;display:flex;flex-direction:column;gap:12px}.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:96px}.chip{height:56px;border-radius:6px;border:1px solid rgba(0,0,0,.08)}.n{font-size:11px;font-weight:600;letter-spacing:.01em}.v{font-size:10px;color:#8a8a8a;font-variant-numeric:tabular-nums}</style></head><body><div class="wrap"><div class="row"><div class="sw"><div class="chip" style="background:var(--action-primary)"></div><div class="n">Action primary</div><div class="v">--action-primary</div></div><div class="sw"><div class="chip" style="background:var(--action-secondary)"></div><div class="n">Action secondary</div><div class="v">--action-secondary</div></div><div class="sw"><div class="chip" style="background:var(--surface-band)"></div><div class="n">Surface band</div><div class="v">--surface-band</div></div><div class="sw"><div class="chip" style="background:var(--surface-band-reviews)"></div><div class="n">Reviews band</div><div class="v">--surface-band-reviews</div></div><div class="sw"><div class="chip" style="background:var(--border-card)"></div><div class="n">Border card</div><div class="v">--border-card</div></div><div class="sw"><div class="chip" style="background:var(--text-on-cta)"></div><div class="n">Text on CTA</div><div class="v">--text-on-cta</div></div></div></div></body></html>
