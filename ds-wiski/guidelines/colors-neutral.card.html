<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{font-family:var(--font-core);background:#fff;color:var(--text-body)}.wrap{padding:20px 24px;display:flex;flex-direction:column;gap:12px}.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:96px}.chip{height:56px;border-radius:6px;border:1px solid rgba(0,0,0,.08)}.n{font-size:11px;font-weight:600;letter-spacing:.01em}.v{font-size:10px;color:#8a8a8a;font-variant-numeric:tabular-nums}</style></head><body><div class="wrap"><div class="row"><div class="sw"><div class="chip" style="background:#ffffff"></div><div class="n">White</div><div class="v">--wiski-white</div></div><div class="sw"><div class="chip" style="background:#f5f5f5"></div><div class="n">Surface tint</div><div class="v">--wiski-surface-tint</div></div><div class="sw"><div class="chip" style="background:#d9d9d9"></div><div class="n">Gray 300</div><div class="v">--wiski-gray-300</div></div><div class="sw"><div class="chip" style="background:#b6b0af"></div><div class="n">Gray warm</div><div class="v">--wiski-gray-warm</div></div><div class="sw"><div class="chip" style="background:#90919a"></div><div class="n">Gray cool</div><div class="v">--wiski-gray-cool</div></div><div class="sw"><div class="chip" style="background:#000000"></div><div class="n">Black</div><div class="v">--wiski-black</div></div></div></div></body></html>
