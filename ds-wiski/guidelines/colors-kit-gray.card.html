<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{font-family:var(--font-core);background:#fff;color:var(--text-body)}.wrap{padding:20px 24px;display:flex;flex-direction:column;gap:12px}.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:96px}.chip{height:56px;border-radius:6px;border:1px solid rgba(0,0,0,.08)}.n{font-size:11px;font-weight:600;letter-spacing:.01em}.v{font-size:10px;color:#8a8a8a;font-variant-numeric:tabular-nums}</style></head><body><div class="wrap"><div class="row"><div class="sw"><div class="chip" style="background:var(--gray-100)"></div><div class="n">Gray 100</div><div class="v">--gray-100</div></div><div class="sw"><div class="chip" style="background:var(--gray-300)"></div><div class="n">Gray 300</div><div class="v">--gray-300</div></div><div class="sw"><div class="chip" style="background:var(--gray-400)"></div><div class="n">Gray 400</div><div class="v">--gray-400</div></div><div class="sw"><div class="chip" style="background:var(--gray-500)"></div><div class="n">Gray 500</div><div class="v">--gray-500</div></div><div class="sw"><div class="chip" style="background:var(--gray-600)"></div><div class="n">Gray 600</div><div class="v">--gray-600</div></div><div class="sw"><div class="chip" style="background:var(--gray-900)"></div><div class="n">Gray 900</div><div class="v">--gray-900</div></div></div></div></body></html>
