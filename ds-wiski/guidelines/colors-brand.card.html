<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{font-family:var(--font-core);background:#fff;color:var(--text-body)}.wrap{padding:20px 24px;display:flex;flex-direction:column;gap:12px}.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:96px}.chip{height:56px;border-radius:6px;border:1px solid rgba(0,0,0,.08)}.n{font-size:11px;font-weight:600;letter-spacing:.01em}.v{font-size:10px;color:#8a8a8a;font-variant-numeric:tabular-nums}</style></head><body><div class="wrap"><div class="row"><div class="sw"><div class="chip" style="background:#2546fd"></div><div class="n">Blue</div><div class="v">--wiski-blue</div></div><div class="sw"><div class="chip" style="background:#4460fe"></div><div class="n">Blue band</div><div class="v">--wiski-blue-band</div></div><div class="sw"><div class="chip" style="background:#fc552a"></div><div class="n">Orange</div><div class="v">--wiski-orange</div></div><div class="sw"><div class="chip" style="background:#fdc41e"></div><div class="n">Yellow</div><div class="v">--wiski-yellow</div></div><div class="sw"><div class="chip" style="background:#f8efe0"></div><div class="n">Cream</div><div class="v">--wiski-cream</div></div><div class="sw"><div class="chip" style="background:#1e1e1b"></div><div class="n">Ink</div><div class="v">--wiski-ink</div></div></div></div></body></html>
