<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Wiski Photobook — Álbumes impresos</title><link rel="stylesheet" href="../../styles.css"><style>html,body{margin:0}body{background:#fff;font-family:var(--font-core)}#root{width:1440px;margin:0 auto}button{font-family:var(--font-core)}
/* Card Grid Reviews on the blue band: the source overrides the section heading fill to #f5f5f5 while the cards keep dark text. */
.wiski-reviews{--text-default-default:rgb(245,245,245)}
.wiski-reviews > div > div > div:nth-child(2){--text-default-default:var(--gray-900)}</style></head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="./SiteHeader.jsx"></script>
<script type="text/babel" src="./HeroSection.jsx"></script>
<script type="text/babel" src="./ProductBand.jsx"></script>
<script type="text/babel" src="./MidSections.jsx"></script>
<script type="text/babel" src="./FooterSections.jsx"></script>
<script type="text/babel">
const LINKS=['Álbumes','Ruta','Momento','Precios','Cómo funciona','Ayuda','Cuenta'];
function App(){
  const [active,setActive]=React.useState('Álbumes');
  const [cart,setCart]=React.useState(0);
  const [chosen,setChosen]=React.useState(null);
  const shelf=React.useRef(null);
  const add=(t)=>{setChosen(t);setCart(c=>c+1)};
  return (<>
    <SiteHeader links={LINKS} active={active} onSelect={setActive} cart={cart}/>
    <HeroSection onStart={()=>shelf.current&&window.scrollTo({top:shelf.current.offsetTop-40,behavior:'smooth'})}/>
    <div ref={shelf}><ProductBand onAdd={add} chosen={chosen}/></div>
    <AdvantagesSection/>
    <StepsSection/>
    <ReviewsBand/>
    <FaqSection/>
    <SiteFooter/>
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
