<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{font-family:var(--font-core);background:#fff;color:var(--text-body)}.wrap{padding:20px 24px;display:flex;flex-direction:column;gap:12px}.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:96px}.chip{height:56px;border-radius:6px;border:1px solid rgba(0,0,0,.08)}.n{font-size:11px;font-weight:600;letter-spacing:.01em}.v{font-size:10px;color:#8a8a8a;font-variant-numeric:tabular-nums}</style></head><body><div class="wrap"><div class="row" style="align-items:center;gap:20px"><div class="sw" style="width:110px"><div style="height:64px;background:var(--wiski-blue);border-radius:5px"></div><div class="n">5px</div><div class="v">--radius-button</div></div><div class="sw" style="width:110px"><div style="height:64px;background:var(--wiski-blue);border-radius:8px"></div><div class="n">8px</div><div class="v">--radius-card</div></div><div class="sw" style="width:110px"><div style="height:64px;background:var(--wiski-blue);border-radius:23px"></div><div class="n">23px</div><div class="v">--radius-badge</div></div><div class="sw" style="width:110px"><div style="height:64px;background:var(--wiski-blue);border-radius:32px"></div><div class="n">32px</div><div class="v">--radius-photo</div></div><div class="sw" style="width:110px"><div style="height:64px;background:var(--wiski-blue);border-radius:9999px"></div><div class="n">9999px</div><div class="v">--radius-round</div></div></div></div></body></html>
